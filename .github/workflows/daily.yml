name: Daily Stock Earnings Update

on:
  schedule:
    # UTC 22:30 (일~목) = KST 07:30 (월~금)
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    # Actions 탭에서 수동으로 "Run workflow" 버튼을 눌러 테스트할 때 사용

permissions:
  contents: write

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 + 메일 발송 + 웹사이트 생성
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collect.py

      - name: 갱신된 DB와 웹사이트를 저장소에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.db docs/index.html
          git diff --cached --quiet || git commit -m "일일 데이터 갱신 $(date +'%Y-%m-%d')"
          git push
